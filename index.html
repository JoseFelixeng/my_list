<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biblioteca do Aventureiro</title>


<!-- Fontes medievais -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative&family=Caudex&display=swap" rel="stylesheet">


<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
<div class="header-inner">
<div class="logo">📜</div>
<h1>Biblioteca do Aventureiro</h1>
</div>
</header>


<main>
<section class="controls">
<input id="search" placeholder="Buscar título...">


<select id="filterCategoria"><option value="">Categoria</option></select>
<select id="filterStatus">
<option value="">Status</option>
<option>Concluído</option>
<option>Em andamento</option>
<option>Pausado</option>
</select>
<select id="filterNota">
<option value="">Nota mínima</option>
<option>10</option><option>9</option><option>8</option><option>7</option>
<option>6</option><option>5</option>
</select>


<button id="btnAdd">Adicionar Item</button>
<div class="save-actions">
<button id="btnDownload">Baixar CSV Atual</button>
<button id="btnGithub">Salvar no GitHub (requere token)</button>
</div>
</section>


<section id="cardsContainer" class="cards"></section>
</main>


<!-- Modal para adicionar itens -->
<div id="modal" class="modal" aria-hidden="true">
<div class="modal-content" role="dialog" aria-modal="true">
<h2>Adicionar Item</h2>
<input id="newTitulo" placeholder="Título">
<input id="newCategoria" placeholder="Categoria">
<input id="newNota" type="number" min="0" max="10" placeholder="Nota">
<input id="newStatus" placeholder="Status (ex: Concluído)">
<input id="newAno" placeholder="Ano">
<div class="modal-actions">
<button id="saveItem">Salvar</button>
<button id="closeModal">Cancelar</button>
</div>
</div>
</div>


<!-- PapaParse para parsing CSV robusto -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
